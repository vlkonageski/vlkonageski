name: Metrics

on:
  # Todo dia às 03:00 UTC (00:00 em Brasília)
  schedule:
    - cron: "0 3 * * *"
  # Botão "Run workflow" na aba Actions
  workflow_dispatch:
  # Roda também quando este arquivo for alterado
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Card principal: cabeçalho, atividade, comunidade e repositórios
      - name: Stats
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: vlkonageski
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo

      # Card de linguagens mais usadas (equivalente ao top-langs)
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: vlkonageski
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_limit: 7
          plugin_languages_sections: most-used

  # Cobrinha comendo o gráfico de contribuições
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Publica os SVGs no branch "output" (separado do main)
      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
